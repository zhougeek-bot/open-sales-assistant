services:
  open-sales-assistant:
    build: .
    image: open-sales-assistant:latest
    container_name: open-sales-assistant
    restart: unless-stopped
    ports:
      - "${PORT:-3100}:3100"
    environment:
      NODE_ENV: production
      PORT: 3100
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3100}
      DATA_BACKUP_DIR: /app/data/backups
      STORAGE_DRIVER: ${STORAGE_DRIVER:-json}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_this_password}
      AI_PROVIDER: ${AI_PROVIDER:-kimi}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.moonshot.cn/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TEXT_MODEL: ${AI_TEXT_MODEL:-kimi-k2.6}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-kimi-k2.6}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
