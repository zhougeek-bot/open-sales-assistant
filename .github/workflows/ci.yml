name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Build Docker image
        run: docker build -t open-sales-assistant:test .

      - name: Run Docker smoke test
        run: |
          trap 'docker compose logs || true; docker compose down' EXIT
          docker compose up -d --build
          sleep 3
          curl --fail --retry 20 --retry-delay 2 --retry-all-errors http://127.0.0.1:3100/api/health
